<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f59e0b" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
  
  <!-- Inner Shield / Circle Accent -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 2" opacity="0.6"/>
  
  <!-- Golden Crown / Laurel Top Accent -->
  <path d="M44 38 L64 24 L84 38 L76 44 L64 34 L52 44 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  
  <!-- Monogram R S (Rishu Sir) -->
  <text x="64" y="82" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="url(#goldGrad)" text-anchor="middle" filter="url(#glow)" letter-spacing="1">
    RS
  </text>
  
  <!-- Bottom Ribbon / Star -->
  <polygon points="64,92 67,100 75,100 68,105 71,113 64,108 57,113 60,105 53,100 61,100" fill="#f59e0b"/>
</svg>
